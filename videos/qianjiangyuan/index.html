    <script>
      (function () {
        const $ = (s) => document.querySelector(s);
        let seed = 41;
        const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
        const tl = gsap.timeline({ paused: true });

        // ---- measured musical grid (see README in conversation): first downbeat 17.04s, 120.3 BPM
        const HIT = 511 / 30; // frame 511 = 17.0333s, nearest frame to the measured downbeat (17.040s)
        const BEAT = 0.49887;
        const B = (k) => +(17.04 + k * BEAT).toFixed(3);

        // ---------------- drawing helpers (SVG strings) ----------------
        const mtn = (opts = {}) => {
          const o = Object.assign({ y: 0, far: 1, mid: 1, near: 1, mist: 0.9, id: "" }, opts);
          return `<div class="full mtn" id="${o.id}">
            <img class="layer m-far" src="assets/art/mtn_far.png" alt="" style="width:2600px;height:1080px;top:${o.y - 60}px;opacity:${o.far}" />
            <img class="layer m-mist1" src="assets/art/mist.png" alt="" style="width:2600px;height:700px;top:${o.y + 120}px;opacity:${o.mist * 0.8}" />
            <img class="layer m-mid" src="assets/art/mtn_mid.png" alt="" style="width:2600px;height:1080px;top:${o.y + 20}px;opacity:${o.mid}" />
            <img class="layer m-mist2" src="assets/art/mist.png" alt="" style="width:2600px;height:700px;top:${o.y + 330}px;opacity:${o.mist}" />
            <img class="layer m-near" src="assets/art/mtn_near.png" alt="" style="width:2600px;height:1080px;top:${o.y + 140}px;opacity:${o.near}" />
          </div>`;
        };
        const dropDefs = (id) => `<radialGradient id="${id}" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#dfe8e6"/><stop offset="0.45" stop-color="#93acaf"/><stop offset="1" stop-color="#4f6a6e"/></radialGradient>`;
        const leaf = (id, x, y, s, rot) => `<g id="${id}" transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
            <path d="M0 0 C 140 -80 330 -60 470 30 C 330 100 140 90 0 0 Z" fill="url(#leafg)" opacity="0.92"/>
            <path d="M0 0 C 160 10 320 20 470 30" stroke="#3d4a40" stroke-width="3" fill="none" opacity="0.7"/>
            ${[80, 160, 240, 320].map((u) => `<path d="M${u} ${u * 0.06} q 40 -40 90 -46" stroke="#3d4a40" stroke-width="2" fill="none" opacity="0.45"/><path d="M${u} ${u * 0.06} q 40 34 90 40" stroke="#3d4a40" stroke-width="2" fill="none" opacity="0.4"/>`).join("")}
          </g>`;
        const leafDefs = `<linearGradient id="leafg" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#4f5f50"/><stop offset="0.6" stop-color="#7e8b7a"/><stop offset="1" stop-color="#a7b3a1"/></linearGradient>`;

        // Zhejiang-style dwelling: white wall, dark tiles, stepped horse-head gables (stylized, not a specific building)
        const house = (x, y, w, h, opts = {}) => {
          const roofH = h * 0.16, step = w * 0.12;
          const lamp = opts.lamp ? `<circle class="${opts.lamp}" cx="${x + w * 0.5}" cy="${y + h * 0.52}" r="60" fill="url(#lampg)" opacity="0"/>` : "";
          const door = `<rect x="${x + w * 0.42}" y="${y + h * 0.58}" width="${w * 0.16}" height="${h * 0.42}" fill="#2e2f2d"/>`;

          .to("#s18-drop", { opacity: 0, duration: 0.06 }, B(268))
          .fromTo("#s18-r1", { scale: 0.1, opacity: 0.9, svgOrigin: "960 300" }, { scale: 2.4, opacity: 0, duration: 2.4, ease: "sine.out" }, B(268))
          .fromTo("#s18-r2", { scale: 0.1, opacity: 0.7, svgOrigin: "960 300" }, { scale: 1.6, opacity: 0, duration: 2.4, ease: "sine.out" }, B(268) + 0.25)
          .fromTo("#title-zh", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1.6, ease: "sine.out" }, B(268) + 0.2)
          .fromTo("#title-en", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.out" }, B(268) + 1.0)
          .fromTo("#s18-line", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 4.5, ease: "sine.inOut" }, B(268) + 0.6)
          .to(["#title-zh", "#title-en", "#s18-line"], { opacity: 0, duration: 2.2, ease: "sine.inOut" }, 157.4)
          .fromTo("#fade-end", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.in" }, 158.6);

        // ---------------- subtitles (original copy) ----------------
        const SUBS = [
          [0.3, 3.9, "你已经走了很远，为什么还会想家？", "You’ve come so far. Why do you still miss home?", "dark"],
          [4.15, 6.85, "溪水穿过群山，流向远处。", "A stream winds through the hills, toward somewhere far.", "light"],
          [7.15, 9.85, "许多人，也走进陌生的城。", "So many of us walk into unfamiliar cities, too.", "light"],
          [10.15, 12.85, "所以，走远为什么仍会回望？", "So why do we still look back?", "light"],
          [13.0, 16.4, "走得再远，会忘记来处吗？", "However far we go — do we forget where we’re from?", "light"],
          [B(9), B(16), "这里是钱塘江的源头地区。", "These are the headwaters of the Qiantang River.", "light"],
          [B(17), B(24), "叶尖的一滴水，落进石缝。", "A drop slips from a leaf into the rocks.", "light"],
          [B(25), B(32), "细流下山，经过屋檐和门前。", "Small streams come down, past eaves and doorsteps.", "light"],
          [B(33), B(40), "每天都听得见，也就不觉得特别。", "You hear it every day, so it seems like nothing.", "light"],
          [B(41), B(48), "山路尽头，家门口亮着一盏灯。", "At the end of the path, a lamp by the door.", "light"],
          [B(65), B(72), "溪流汇在一起，河面慢慢变宽。", "Streams meet, and the river grows wider.", "light"],
          [B(74), B(81), "水要去远方，人也一样。", "The water is heading far away. So are we.", "light"],
          [B(82), B(89), "一只行李箱，一张车票。", "One suitcase. One ticket.", "light"],
          [B(90), B(97), "溪流转个弯，就成了路。", "The stream bends — and becomes a road.", "light"],
          [B(98), B(105), "城市很大，灯很多。", "The city is big. So many lights.", "dark"],
          [B(106), B(112), "地铁、工位、外卖，日子很满。", "Subways, desks, takeout — full days.", "dark"],
          [B(114), B(121), "也有一个人吃晚饭的时候。", "And evenings eating dinner alone.", "dark"],
          [B(125), B(132), "窗外，下雨了。", "Outside the window, it starts to rain.", "dark"],
          [B(134), B(141), "雨声，像极了老家屋檐下的水声。", "It sounds just like water under the eaves back home.", "dark"],
          [B(143), B(150), "杯里的水，轻轻一晃——", "The water in the glass trembles —", "dark"],
          [B(155), B(162), "溪声、山路、乡音，一下子都回来了。", "The stream, the path, the accent — all come back.", "light"],
          [B(164), B(171), "原来，来处一直跟着你。", "Where you’re from has been with you all along.", "light"],
          [B(172), B(179), "它在你的口音里，在你的习惯里。", "In the way you speak, the way you live.", "light"],
          [B(181), B(188), "也在你想家时，想起的那盏灯里。", "In the lamp you picture when you miss home.", "light"],
          [B(198), B(205), "水不会回头，它一直向前。", "Water never turns back. It keeps going.", "light"],
          [B(208), B(215), "可每一条河，都记得山里的源头。", "Yet every river remembers its spring in the hills.", "light"],
          [B(232), B(239), "走进新的城，过新的日子。", "Into new cities, into new days.", "light"],
          [B(244), B(251), "累了的时候，就想想那条溪。", "When you’re tired, think of that stream.", "light"],
          [B(256), B(265), "来处，是让你敢走远的地方。", "Where you’re from is what lets you go far.", "light"],
        ];
        const subsEl = $("#subs");
        SUBS.forEach(([a, b, zh, en, tone], i) => {
          const el = document.createElement("div");
          el.className = "sub " + (tone === "dark" ? "on-dark" : "on-light");
          el.id = "sub" + i;
          el.innerHTML = `<div class="zh">${zh}</div><div class="en">${en}</div>`;
          subsEl.appendChild(el);
          tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "sine.out" }, a)
            .to(el, { opacity: 0, duration: 0.4, ease: "sine.in" }, b - 0.4);
        });
        // light reading band only under light-scene subtitles
        SUBS.forEach(([a, b, , , tone]) => {
          if (tone === "light") tl.to("#sub-band", { opacity: 1, duration: 0.45 }, a).to("#sub-band", { opacity: 0, duration: 0.4 }, b - 0.4);
        });
        window.__SUBS = SUBS;

        // ---------------- finishing: grain flicker (4 frames cycling), stronger in dark scenes ----------------
        // one proxy tween drives which of 4 grain plates shows; frozen during the pre-hit breath (16.9s → HIT)
        const gp = { t: 0 };
        const plates = [0, 1, 2, 3].map((k) => document.getElementById("g" + k));
        tl.to(gp, {
          t: 160.1, duration: 160.1, ease: "none",
          onUpdate: () => {
            let f = Math.floor(gp.t * 30 + 1e-6);
            if (gp.t >= 16.9 && gp.t < HIT) f = Math.floor(16.9 * 30);
            plates.forEach((p, k) => (p.style.opacity = k === f % 4 ? "0.1" : "0"));
          },
        }, 0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
